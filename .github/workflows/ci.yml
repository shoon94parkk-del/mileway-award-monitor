name: Validate collector
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'public-data/status.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run unit tests
        run: npm test
      - name: Check source syntax
        run: |
          node --check src/public-extract.mjs
          node --check src/public-calendar.mjs
          node --check src/public-report.mjs
          node --check src/public-source-check.mjs
          node --check src/route-discovery.mjs
          node --check src/alert-rules.mjs
          node --check scripts/notify-alerts.mjs
          node --check scripts/write-health.mjs
          node --check scripts/build-cloud.mjs
          node --check scripts/publish-data.mjs
          node --check web/cloud-api.js
          node --check web/cloud-enhancements.js
          node --check web/global-regions.js
          node --check web/service-worker.js
          node --check web/seat-info.js
          node --check web/seat-metadata.js
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.webmanifest','utf8'))"
      - name: Build cloud site
        run: |
          node --no-warnings scripts/build-cloud.mjs
          node --check dist/app.js
          node --check dist/cloud-api.js
          node --check dist/cloud-enhancements.js
          node --check dist/global-regions.js
          node --check dist/service-worker.js
          node --check dist/seat-info.js
          node --check dist/seat-metadata.js
          test -s dist/cloud-enhancements.css
          test -s dist/seat-info.css
          test -s dist/manifest.webmanifest
