name: Collect Europe to Incheon award returns
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-europe-returns.yml'
      - 'scripts/collect-europe-returns.mjs'
      - 'scripts/europe-return-shards.mjs'
      - 'scripts/merge-europe-return-shards.mjs'
      - 'src/public-accessible-award.mjs'
  schedule:
    # 03:40 KST daily, after the usual outbound collection window.
    - cron: '40 18 * * *'
permissions:
  contents: write
concurrency:
  group: mileway-europe-return-collection
  cancel-in-progress: true

jobs:
  preflight:
    name: Respect public-source access-limit cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.cooldown.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stop before any browser launch during access-limit cooldown
        id: cooldown
        run: node scripts/collection-preflight.mjs public-data/health.json

  scan:
    needs: preflight
    if: github.event.repository.private == false && needs.preflight.outputs.allowed == 'true'
    name: Europe return browser runner ${{ matrix.id }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { id: 0, routes: 'LHR,FCO,LIS' }
          - { id: 1, routes: 'MAD,MXP,BCN' }
          - { id: 2, routes: 'BUD,VIE,AMS' }
          - { id: 3, routes: 'IST,ZRH,CDG' }
          - { id: 4, routes: 'PRG,FRA' }
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install public browser automation
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Validate the return calendar reader and five-runner merge
        run: node --test test/europe-return-shards.test.mjs test/europe-returns.test.mjs test/public-accessible-award.test.mjs test/public-modern-ui.test.mjs
      - name: Collect visible Europe-to-Incheon award calendars
        shell: pwsh
        run: |
          Write-Host "Europe return runner ${{ matrix.id }} scanning: ${{ matrix.routes }}"
          node --no-warnings scripts/collect-europe-returns.mjs --route "${{ matrix.routes }}" --output data/returns-europe.json --interval-ms 3500
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload public return diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: return-diagnostics-${{ matrix.id }}
          path: data/returns-europe.json
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: return-shard-${{ matrix.id }}
          path: data/returns-europe.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Merge five return runners and publish completed calendar
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: return-shard-*
          path: data/return-parts
      - name: Confirm all 14 origins and every month before publication
        run: node --no-warnings scripts/merge-europe-return-shards.mjs data/return-parts data/returns-europe.json
      - name: Commit return award calendar for Render site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          node --no-warnings scripts/publish-europe-returns.mjs data/returns-europe.json public-data/returns.json
          git add public-data/returns.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish five-runner Europe-to-ICN return award calendars"
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((5*i))
            done
            exit 1
          fi
