name: Collect public daily award seats
on:
  workflow_dispatch:
    inputs:
      force_full_scan:
        description: Force a full collection even when the Korean Air source timestamp is unchanged
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'src/public-source-check.mjs'
      - 'src/source-observer.mjs'
      - 'src/source-timestamp.mjs'
      - 'src/public-navigation.mjs'
      - 'src/public-extract.mjs'
      - 'test/public-source-check.test.mjs'
      - '.github/workflows/collect.yml'
  schedule:
    # Normal hours: lightweight source check about once per hour.
    - cron: '17 0-12,16-23 * * *'
    # 22:57 KST: start one watcher before the observed 23:00 Korean Air daily refresh.
    # The watcher polls every 30 seconds until 23:12 KST and launches collection immediately when the source changes.
    - cron: '57 13 * * *'
    # 23:10 KST backup check in case the watcher did not start on time or ended early.
    - cron: '10 14 * * *'
    # GitHub-hosted US runners can receive the Korean Air daily source later than Korean clients.
    # Keep checking every five minutes through 01:15 KST so regional propagation does not create a long blind spot.
    - cron: '15-55/5 14 * * *'
    - cron: '0-55/5 15 * * *'
    - cron: '0-15/5 16 * * *'
    # 23:31 KST safety check. If the timestamp check itself fails, force a collection attempt.
    - cron: '31 14 * * *'
    # 00:35 KST daily fail-safe. If the runner still sees an older source marker, force a fresh scan anyway.
    - cron: '35 15 * * *'
permissions:
  contents: write
concurrency:
  group: public-daily-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auto-register Telegram target
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --no-warnings scripts/register-telegram.mjs
      - name: Install collector dependency
        id: install
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Watch/check Korean Air source timestamp
        id: source
        if: github.event_name != 'workflow_dispatch' || inputs.force_full_scan != true
        shell: pwsh
        run: |
          $schedule = '${{ github.event.schedule }}'
          $watchSchedule = '57 13 * * *'
          $safetySchedule = '31 14 * * *'
          $dailyFailSafeSchedule = '35 15 * * *'

          if ($schedule -eq $watchSchedule) {
            $deadline = [DateTime]::UtcNow.Date.AddHours(14).AddMinutes(12)
            $successfulChecks = 0
            $check = 0
            do {
              $check++
              Write-Host "Fast source watcher check $check (30-second cadence, deadline 23:12 KST)"
              $lines = & node --no-warnings src/public-source-check.mjs --snapshot public-data/snapshot.json 2>&1
              $exitCode = $LASTEXITCODE
              $lines | ForEach-Object { Write-Host $_ }
              if ($exitCode -eq 0) {
                $successfulChecks++
                if (($lines -join "`n") -match 'Source changed: full collection required') {
                  Write-Host "Korean Air daily source change detected; starting regional collection immediately."
                  exit 0
                }
              } else {
                Write-Warning "Watcher source check failed; retrying instead of missing the refresh."
              }
              if ([DateTime]::UtcNow -ge $deadline) { break }
              Start-Sleep -Seconds 30
            } while ($true)

            if ($successfulChecks -eq 0) {
              Write-Warning "Watcher could not complete a single timestamp check; force a collection attempt as fail-safe."
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'changed=true'
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'current='
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'previous='
            } else {
              Write-Host "No source change detected before watcher deadline; post-midnight fallback checks remain armed."
            }
            exit 0
          }

          $success = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "Source check attempt $attempt/2"
            $sourceArgs = @('--snapshot','public-data/snapshot.json')
            if ($schedule -eq $dailyFailSafeSchedule) { $sourceArgs += '--force-if-stale-daily' }
            node --no-warnings src/public-source-check.mjs @sourceArgs
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            if ($attempt -lt 2) { Start-Sleep -Seconds 10 }
          }

          if (-not $success) {
            if ($schedule -eq $safetySchedule -or $schedule -eq $dailyFailSafeSchedule) {
              Write-Warning "Safety source check failed; forcing a collection attempt rather than silently missing the day."
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'changed=true'
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'current='
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'previous='
              exit 0
            }
            Write-Error "Could not read the Korean Air public source timestamp."
            exit 1
          }
      - name: Test collection-critical parsers
        id: tests
        if: steps.source.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_full_scan)
        run: node --test test/public-source-check.test.mjs test/public-navigation.test.mjs test/public-report.test.mjs test/publication-validation.test.mjs test/regional-publication.test.mjs test/route-discovery.test.mjs
      - name: Collect and publish Europe, Americas, Oceania, then Asia
        id: collect
        if: steps.source.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_full_scan)
        run: node --no-warnings scripts/collect-regions.mjs
      - name: Notify matching seat alerts
        id: notify
        if: always() && steps.collect.outputs.published == 'true'
        continue-on-error: true
        env:
          ALERT_RULES_JSON: ${{ secrets.ALERT_RULES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node --no-warnings scripts/notify-alerts.mjs --snapshot public-data/snapshot.json --state public-data/alert-state.json
      - name: Update public health
        id: health
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          BUILD_OUTCOME: ${{ steps.collect.outputs.published == 'true' && 'success' || 'skipped' }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
          FULL_SCAN: ${{ steps.collect.outcome == 'success' }}
          CURRENT_SOURCE: ${{ steps.source.outputs.current }}
          ALERT_RULES_JSON: ${{ secrets.ALERT_RULES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node --no-warnings scripts/write-health.mjs public-data/health.json
      - name: Persist public state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/health.json
          if [ -f public-data/alert-state.json ]; then git add public-data/alert-state.json; fi
          if [ -f public-data/telegram-target.json ]; then git add public-data/telegram-target.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Mileway public state"
            git pull --rebase origin main
            git push
          fi
      - name: No source change
        if: steps.source.outputs.changed != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.force_full_scan != true)
        run: Write-Host "Korean Air source timestamp is unchanged; full collection skipped."
