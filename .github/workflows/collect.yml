name: Collect public daily award seats
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: public-daily-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve KST collection cycle
        id: cycle
        shell: pwsh
        run: |
          $cycle = node --no-warnings scripts/cycle-info.mjs --prewarm-minutes 15 | ConvertFrom-Json
          $safe = $cycle.cycle_id -replace '[:+]','-'
          "id=$safe" >> $env:GITHUB_OUTPUT
          Write-Host "Collection cycle: $($cycle.cycle_id)"
      # A forced/interlock scan must really query Korean Air again. Do not restore
      # route/month checkpoints from an older run just because a previous run saw
      # the same source marker. In-process retries still resume local files.
      - name: Start with clean route-month checkpoints
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force data/region-0,data/region-1,data/region-2,data/region-3 -ErrorAction SilentlyContinue
          Write-Host "Fresh full scan armed: no cross-run route/month cache will be reused."
      - name: Auto-register Telegram target
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --no-warnings scripts/register-telegram.mjs
      - name: Install collector dependency
        id: install
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Test collection-critical parsers
        id: tests
        run: node --test test/public-source-check.test.mjs test/public-navigation.test.mjs test/public-direct-client.test.mjs test/public-report.test.mjs test/publication-validation.test.mjs test/regional-publication.test.mjs test/route-discovery.test.mjs test/collection-cycle.test.mjs
      - name: Collect and publish Europe, Americas, Oceania, then Asia
        id: collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Guarded hybrid mode: the first month of each route is still collected
          # through the verified Korean Air UI. The captured request then drives
          # the remaining months through the same public API. Any unexpected
          # response automatically falls back to the existing UI collector.
          MILEWAY_DIRECT_API: '1'
          COLLECT_DIRECT_INTERVAL_MS: '1000'
        run: node --no-warnings scripts/collect-regions.mjs
      - name: Report acceleration metrics
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem data -Filter results.json -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'region-[0-3]' }
          $ui=0; $direct=0; $verified=0; $verifyCalls=0; $fallbacks=0; $verifyFail=0; $elapsed=@()
          foreach ($file in $files) {
            $r = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if ($r.acceleration) {
              $ui += [int]$r.acceleration.ui_months
              $direct += [int]$r.acceleration.direct_months
              $verified += [int]$r.acceleration.direct_templates_verified
              $verifyCalls += [int]$r.acceleration.direct_verification_calls
              $fallbacks += [int]$r.acceleration.direct_fallbacks
              $verifyFail += [int]$r.acceleration.direct_verification_failures
            }
            if ($r.elapsed_ms) { $elapsed += [int64]$r.elapsed_ms }
          }
          $covered = $ui + $direct
          $share = if ($covered -gt 0) { [math]::Round(100*$direct/$covered,1) } else { 0 }
          $maxElapsed = if ($elapsed.Count) { ($elapsed | Measure-Object -Maximum).Maximum } else { 0 }
          Write-Host "ACCELERATION TOTAL UI=$ui DIRECT=$direct DIRECT_SHARE=$share% VERIFIED=$verified/$verifyCalls FALLBACKS=$fallbacks VERIFY_FAIL=$verifyFail MAX_REGION_ELAPSED_MS=$maxElapsed"
          "### Mileway collection acceleration" >> $env:GITHUB_STEP_SUMMARY
          "- UI months: $ui" >> $env:GITHUB_STEP_SUMMARY
          "- Direct API months: $direct ($share%)" >> $env:GITHUB_STEP_SUMMARY
          "- Direct templates verified: $verified / $verifyCalls" >> $env:GITHUB_STEP_SUMMARY
          "- Direct fallbacks: $fallbacks" >> $env:GITHUB_STEP_SUMMARY
          "- Verification failures: $verifyFail" >> $env:GITHUB_STEP_SUMMARY
          "- Slowest regional collector: $maxElapsed ms" >> $env:GITHUB_STEP_SUMMARY
      - name: Recheck matching seat alerts after all regional publications
        id: notify
        if: always() && steps.collect.outputs.published == 'true'
        continue-on-error: true
        env:
          ALERT_RULES_JSON: ${{ secrets.ALERT_RULES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node --no-warnings scripts/notify-alerts.mjs --snapshot public-data/snapshot.json --state public-data/alert-state.json
      - name: Update public health
        id: health
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SOURCE_OUTCOME: skipped
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          BUILD_OUTCOME: ${{ steps.collect.outputs.published == 'true' && 'success' || 'skipped' }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
          FULL_SCAN: ${{ steps.collect.outcome == 'success' }}
          ALERT_RULES_JSON: ${{ secrets.ALERT_RULES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node --no-warnings scripts/write-health.mjs public-data/health.json
      - name: Refresh public status from final snapshot
        id: status
        if: always()
        run: node --no-warnings scripts/build-public-status.mjs
      - name: Persist public state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/health.json public-data/status.json
          if [ -f public-data/alert-state.json ]; then git add public-data/alert-state.json; fi
          if [ -f public-data/telegram-target.json ]; then git add public-data/telegram-target.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Mileway public state"
            git pull --rebase origin main
            git push
          fi
