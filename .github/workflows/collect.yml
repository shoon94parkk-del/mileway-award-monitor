name: Collect public daily award seats
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml', 'src/public-extract.mjs', 'src/outbound-ui-collector.mjs', 'src/public-accessible-award.mjs']
permissions:
  contents: write
concurrency:
  group: public-daily-collection
  # Cancel the older two-lane scanner when the new five-runner scan starts.
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.repository.private == false
    name: Outbound browser runner ${{ matrix.id }} (${{ matrix.label }})
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { id: 0, label: 'Europe A', routes: 'LHR,FCO,LIS,MAD,MXP,BCN,BUD' }
          - { id: 1, label: 'Europe B', routes: 'VIE,AMS,IST,ZRH,CDG,PRG,FRA' }
          - { id: 2, label: 'Americas A', routes: 'JFK,EWR,DFW,LAS,LAX,YVR,BOS' }
          - { id: 3, label: 'Americas B', routes: 'SFO,SEA,ORD,ATL,IAD,YYZ,HNL' }
          - { id: 4, label: 'Oceania + Bali', routes: 'MEL,BNE,SYD,AKL,DPS' }
    runs-on: windows-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Validate public UI collector and 5-runner partitions
        run: node --test test/outbound-ui-collector.test.mjs test/outbound-five-runner.test.mjs test/public-accessible-award.test.mjs test/public-modern-ui.test.mjs
      - name: Scrape Korean Air rendered seat calendar
        env:
          MILEWAY_DIRECT_API: '0'
        shell: pwsh
        run: |
          Write-Host "Runner ${{ matrix.id }} scanning: ${{ matrix.routes }}"
          node --no-warnings src/public-extract.mjs --route "${{ matrix.routes }}" --output data/shard-results --interval-ms 3000 --max-retries 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: outbound-shard-${{ matrix.id }}
          path: data/shard-results/results.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Merge 5 runners, validate 4 regions and publish
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: outbound-shard-*
          path: data/outbound-shards
      - name: Check five shards and validate all regional coverage
        run: node --no-warnings scripts/merge-outbound-shards.mjs data/outbound-shards data/outbound-merged
      - name: Publish all validated regions together
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          for i in 0 1 2 3; do
            node --no-warnings scripts/publish-data.mjs "data/outbound-merged/$i.json"
            node --no-warnings scripts/build-cloud.mjs
            cp dist/snapshot.json public-data/snapshot.json
          done
          node --check dist/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add public-data/results.json.gz public-data/snapshot.json public-data/changes.json
          git diff --cached --quiet && { echo 'No changes to publish'; exit 0; }
          git commit -m "Publish five-runner outbound award-seat scan"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Check seat alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --no-warnings scripts/notify-alerts.mjs --snapshot public-data/snapshot.json

  status:
    name: Record full scan health
    needs: [scan, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auto-register Telegram target
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --no-warnings scripts/register-telegram.mjs
      - name: Record collection and publication status
        env:
          INSTALL_OUTCOME: success
          SOURCE_OUTCOME: skipped
          TESTS_OUTCOME: ${{ needs.scan.result }}
          COLLECT_OUTCOME: ${{ needs.scan.result }}
          BUILD_OUTCOME: ${{ needs.publish.result }}
          FULL_SCAN: ${{ needs.publish.result == 'success' }}
          NOTIFY_OUTCOME: skipped
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node --no-warnings scripts/write-health.mjs public-data/health.json
          node --no-warnings scripts/build-public-status.mjs
      - name: Publish health state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add public-data/health.json public-data/status.json
          if [ -f public-data/telegram-target.json ]; then git add public-data/telegram-target.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record five-runner outbound scanner status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
