name: Collect public daily award seats
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-daily-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve KST collection cycle
        id: cycle
        shell: pwsh
        run: |
          $cycle = node --no-warnings scripts/cycle-info.mjs --prewarm-minutes 15 | ConvertFrom-Json
          $safe = $cycle.cycle_id -replace '[:+]','-'
          "id=$safe" >> $env:GITHUB_OUTPUT
          Write-Host "Collection cycle: $($cycle.cycle_id)"
      - name: Restore route-month checkpoints
        uses: actions/cache@v4
        with:
          path: |
            data/region-0
            data/region-1
            data/region-2
            data/region-3
          key: mileway-checkpoint-${{ runner.os }}-${{ steps.cycle.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            mileway-checkpoint-${{ runner.os }}-${{ steps.cycle.outputs.id }}-
      - name: Auto-register Telegram target
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --no-warnings scripts/register-telegram.mjs
      - name: Install collector dependency
        id: install
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Test collection-critical parsers
        id: tests
        run: node --test test/public-source-check.test.mjs test/public-navigation.test.mjs test/public-report.test.mjs test/publication-validation.test.mjs test/regional-publication.test.mjs test/route-discovery.test.mjs test/collection-cycle.test.mjs
      - name: Collect and publish Europe, Americas, Oceania, then Asia
        id: collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node --no-warnings scripts/collect-regions.mjs
      - name: Recheck matching seat alerts after all regional publications
        id: notify
        if: always() && steps.collect.outputs.published == 'true'
        continue-on-error: true
        env:
          ALERT_RULES_JSON: ${{ secrets.ALERT_RULES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node --no-warnings scripts/notify-alerts.mjs --snapshot public-data/snapshot.json --state public-data/alert-state.json
      - name: Update public health
        id: health
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SOURCE_OUTCOME: skipped
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          BUILD_OUTCOME: ${{ steps.collect.outputs.published == 'true' && 'success' || 'skipped' }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
          FULL_SCAN: ${{ steps.collect.outcome == 'success' }}
          ALERT_RULES_JSON: ${{ secrets.ALERT_RULES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node --no-warnings scripts/write-health.mjs public-data/health.json
      - name: Refresh public status from final snapshot
        id: status
        if: always()
        run: node --no-warnings scripts/build-public-status.mjs
      - name: Persist public state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/health.json public-data/status.json
          if [ -f public-data/alert-state.json ]; then git add public-data/alert-state.json; fi
          if [ -f public-data/telegram-target.json ]; then git add public-data/telegram-target.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Mileway public state"
            git pull --rebase origin main
            git push
          fi
