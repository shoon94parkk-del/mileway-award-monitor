name: Diagnose Korean Air public award UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-award-ui.yml', 'src/public-ui.mjs', 'src/public-month-ui.mjs', 'scripts/collect-europe-returns.mjs']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Smoke Europe to Incheon shared collector (CDG, April 2027)
        run: node --no-warnings scripts/collect-europe-returns.mjs --route CDG --start 2027-04-01 --end 2027-04-30 --output data/smoke-europe-return.json
