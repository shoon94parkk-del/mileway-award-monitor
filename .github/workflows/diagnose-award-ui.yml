name: Diagnose Korean Air public award UI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-daily-collection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Validate passive browser diagnostics
        run: node --test test/public-query-diagnostics.test.mjs
      - name: Inspect page and airport loading without submitting a seat query
        env:
          MILEWAY_STANDARD_CHROME: '1'
          MILEWAY_DIRECT_API: '0'
          MILEWAY_QUERY_DIAGNOSTICS: '1'
        run: node --no-warnings src/public-extract.mjs --discover-only --output data/public-bootstrap-diagnostics --max-retries 1
      - name: Retain bounded page-loading evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-bootstrap-diagnostics
          path: data/public-bootstrap-diagnostics/query-diagnostics.json
          if-no-files-found: warn
          retention-days: 3
