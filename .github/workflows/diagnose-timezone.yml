name: Diagnose Korean Air timezone
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-timezone.yml'
      - 'scripts/diagnose-timezone.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Compare default and Seoul browser timezones
        run: node --no-warnings scripts/diagnose-timezone.mjs
