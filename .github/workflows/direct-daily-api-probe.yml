name: Probe direct Korean Air daily API
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-direct-daily-api.mjs'
      - '.github/workflows/direct-daily-api-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Verify browser bootstrap then direct monthly API calls
        run: node --no-warnings scripts/probe-direct-daily-api.mjs
