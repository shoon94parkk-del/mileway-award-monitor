name: Smoke hybrid direct daily API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-hybrid-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-public-award-seats
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Run two-month LAX hybrid smoke
        shell: pwsh
        run: |
          $start = node -e "const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'});console.log(f.format(new Date()))"
          $end = node -e "const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit'});const [y,m]=f.format(new Date()).split('-').map(Number);console.log(new Date(Date.UTC(y,m+1,0)).toISOString().slice(0,10))"
          Write-Host "Hybrid smoke range: $start -> $end"
          node --no-warnings src/public-extract.mjs --headless --route LAX --start $start --end $end --output data/direct-smoke --max-retries 2 --interval-ms 2500 --direct-after-first --direct-interval-ms 1000
      - name: Summarize hybrid engine usage
        if: always()
        shell: pwsh
        run: |
          if (Test-Path data/direct-smoke/results.json) {
            $r = Get-Content data/direct-smoke/results.json -Raw | ConvertFrom-Json
            Write-Host "ENGINE=$($r.collection_engine) SOURCE=$($r.source_updated_at)"
            $r.coverage | ForEach-Object { Write-Host "COVERAGE $($_.destination) $($_.month) engine=$($_.engine) rows=$($_.flightClassRows)" }
            $r.unqueryable | ForEach-Object { Write-Host "UNQUERYABLE $($_.destination) $($_.month) engine=$($_.engine)" }
          } else {
            Write-Host 'No smoke results.json was produced.'
          }
