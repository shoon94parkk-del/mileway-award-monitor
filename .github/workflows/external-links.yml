name: Refresh external ZoomMyTrip references
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-links.yml'
      - 'scripts/refresh-external-links.mjs'
      - 'test/external-links.test.mjs'
  schedule:
    # Low-frequency public RSS TITLE+LINK discovery only (KST 04:10, 08:20).
    - cron: '10 19 * * *'
    - cron: '20 23 * * *'
permissions:
  contents: write
concurrency:
  group: mileway-external-source-links
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check link-only feed parser and source protections
        run: node --test test/external-links.test.mjs
      - name: Inspect advertised public article feed (titles and URLs only)
        run: node --no-warnings scripts/refresh-external-links.mjs public-data/external-links.json
      - name: Publish newer external article references without copying inventories
        shell: bash
        run: |
          set -euo pipefail
          git add public-data/external-links.json
          if git diff --cached --quiet; then
            echo "No newer provider source references."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update externally published award-seat reference links"
          git pull --rebase origin main
          git push origin HEAD:main
