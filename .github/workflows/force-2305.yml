name: Force daily scan by 23:05 KST
on:
  schedule:
    # Start well before the top-of-hour congestion window, then wait inside the runner.
    - cron: '50 13 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  force-start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ensure full collection has started by 23:05 KST
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow="collect.yml"

          # The scheduled runner is intentionally allocated around 22:50 KST.
          # Waiting inside an already-running job is much more reliable than asking
          # GitHub to start a new scheduled run exactly around 23:00 KST.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            target=$(date -u -d "$(date -u +%F) 14:05:00" +%s)
            now=$(date -u +%s)
            if [ "$now" -lt "$target" ]; then
              echo "Interlock prewarmed; waiting until 23:05 KST."
              sleep "$((target-now))"
            fi
          fi

          active=$(gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')

          if [ "$active" -gt 0 ]; then
            echo "A full collection is already queued/running; no duplicate force scan needed."
            exit 0
          fi

          echo "23:05 KST interlock: dispatching forced full scan regardless of the DOM timestamp."
          gh workflow run "$workflow" --repo "$repo" --ref main -f force_full_scan=true
