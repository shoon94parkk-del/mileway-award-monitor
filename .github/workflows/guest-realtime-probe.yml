name: Guest realtime probe
on:
  push:
    branches:
      - make-alert-visible
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Probe Korean Air guest realtime API
        run: node --no-warnings scripts/guest-realtime-probe.mjs
