name: Probe aircraft sources once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-aircraft-sources-once.mjs'
      - '.github/workflows/probe-aircraft-sources-once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: node --no-warnings scripts/probe-aircraft-sources-once.mjs
