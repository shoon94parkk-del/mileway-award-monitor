name: Probe worldwide Korean Air routes
on:
  push:
    branches: [main]
    paths: ['.github/run-route-probe.trigger']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Discover Korean Air public destinations
        run: node --no-warnings scripts/discover-public-routes.mjs
