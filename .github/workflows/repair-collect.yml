name: Repair collector workflow
on:
  push:
    paths:
      - '.github/workflows/repair-collect.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair exact transport corruptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/collect.yml')
          s = p.read_text()
          replacements = {
              '[DateTime::UtcNow.Date': '[DateTime]::UtcNow.Date',
              '$check ++': '$check++',
              'Source check attemp $attempt/2': 'Source check attempt $attempt/2',
              'RESEND_API_KEY: $' + '{{ secrets.RESEND_API_KEY y}': 'RESEND_API_KEY: $' + '{{ secrets.RESEND_API_KEY }}',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected repair target missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/collect.yml
          git rm .github/workflows/repair-collect.yml
          git commit -m "Repair 23:05 collector interlock workflow"
          git push
