name: Korean Air source freshness probe
on:
  push:
    branches: [fast-source-watcher]
    paths:
      - 'scripts/source-freshness-probe.mjs'
      - '.github/workflows/source-freshness-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: node --no-warnings scripts/source-freshness-probe.mjs
