name: Watch Korean Air daily source
on:
  schedule:
    # Allocate a runner before the 23:00 KST refresh window, then poll inside it.
    - cron: '47 13 * * *'
    # Independent late backups in case the primary schedule is delayed/dropped or a US edge is stale.
    - cron: '33 14 * * *'
    - cron: '3 15 * * *'
    - cron: '33 15 * * *'
    - cron: '3 16 * * *'
    - cron: '33 16 * * *'
    - cron: '3 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-watch.yml'
      - 'src/public-source-check.mjs'
      - 'src/source-observer.mjs'
      - 'src/source-timestamp.mjs'
      - 'src/collection-cycle.mjs'
      - 'scripts/cycle-info.mjs'
      - 'src/public-navigation.mjs'
      - 'test/public-source-check.test.mjs'
      - 'test/collection-cycle.test.mjs'
permissions:
  actions: write
  contents: read
concurrency:
  group: public-source-watch
  cancel-in-progress: false
jobs:
  watch:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lightweight watcher dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Test source freshness logic
        run: node --test test/public-source-check.test.mjs test/public-navigation.test.mjs test/collection-cycle.test.mjs
      - name: Poll Korean Air source and dispatch collector
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $schedule = '${{ github.event.schedule }}'
          $primary = '47 13 * * *'

          $cycle = (node --no-warnings scripts/cycle-info.mjs --prewarm-minutes 15 | ConvertFrom-Json)
          $cycleStart = [DateTime]::Parse($cycle.cycle_start_utc).ToUniversalTime()
          $watcherFailSafeAt = $cycleStart.AddMinutes(8)
          $staleRetryCooldown = [TimeSpan]::FromMinutes(55)
          Write-Host "Collection cycle: $($cycle.cycle_id) / expected source $($cycle.expected_source_at)"

          function Start-CollectorIfIdle {
            param(
              [Parameter(Mandatory=$true)][string]$Reason,
              [switch]$RespectStaleCooldown
            )

            $runsJson = & gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/collect.yml/runs?per_page=30"
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect collector workflow state' }
            $runs = ($runsJson | ConvertFrom-Json).workflow_runs

            $active = @($runs | Where-Object { $_.status -eq 'in_progress' -or $_.status -eq 'queued' })
            if ($active.Count -gt 0) {
              Write-Host "Collector already queued/running; watcher will not create a duplicate run."
              return
            }

            if ($RespectStaleCooldown) {
              $recent = @($runs | Where-Object {
                $created = [DateTime]::Parse($_.created_at).ToUniversalTime()
                $created -ge $cycleStart -and ([DateTime]::UtcNow - $created) -lt $staleRetryCooldown
              })
              if ($recent.Count -gt 0) {
                $latest = $recent | Sort-Object { [DateTime]::Parse($_.created_at) } -Descending | Select-Object -First 1
                Write-Host "A stale-source safety scan already started recently ($($latest.created_at)); waiting before another expensive full scan."
                return
              }
            }

            Write-Host "$Reason; dispatching full collector."
            & gh workflow run collect.yml --repo $env:GITHUB_REPOSITORY --ref main
            if ($LASTEXITCODE -ne 0) { throw 'Collector dispatch failed' }
          }

          if ($schedule -eq $primary) {
            $pollStart = $cycleStart.AddMinutes(-3)  # 22:57 KST
            $deadline = $cycleStart.AddMinutes(20)   # 23:20 KST
            if ([DateTime]::UtcNow -lt $pollStart) {
              $wait = [int][Math]::Ceiling(($pollStart - [DateTime]::UtcNow).TotalSeconds)
              Write-Host "Watcher prewarmed before 23:00 KST; waiting $wait seconds before polling."
              Start-Sleep -Seconds $wait
            }
            if ([DateTime]::UtcNow -gt $deadline) {
              # If GitHub started this schedule very late, still perform a short immediate check.
              $deadline = [DateTime]::UtcNow.AddMinutes(2)
            }
            $intervalSeconds = 30
          } else {
            # Manual/push/backup runs are short independent checks.
            $deadline = [DateTime]::UtcNow.AddMinutes(2)
            $intervalSeconds = 20
          }

          $successfulChecks = 0
          $attempt = 0
          $sawStaleDailyMarker = $false
          do {
            $attempt++
            Write-Host "Source watcher attempt $attempt"
            $lines = & node --no-warnings src/public-source-check.mjs --snapshot public-data/snapshot.json 2>&1
            $exitCode = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host $_ }
            $text = $lines -join "`n"

            if ($exitCode -eq 0) {
              $successfulChecks++
              $isStale = $text -match 'Daily freshness warning:'
              if ($isStale) { $sawStaleDailyMarker = $true }

              if ($text -match 'Source changed: full collection required') {
                Start-CollectorIfIdle -Reason 'Fresh Korean Air daily source detected'
                exit 0
              }

              # A US edge can keep serving yesterday's DOM marker even after Korea has refreshed.
              # After 23:08 KST, stale DOM is advisory only: make sure an actual bonusSeatView
              # full scan is retried, with a cooldown so we never stack expensive collectors.
              if ($isStale -and [DateTime]::UtcNow -ge $watcherFailSafeAt) {
                Start-CollectorIfIdle -Reason 'Korean Air DOM marker is still stale after the daily refresh window' -RespectStaleCooldown
              }
            } else {
              Write-Warning "Source check failed; retrying within the watcher window."
            }

            if ([DateTime]::UtcNow -ge $deadline) { break }
            Start-Sleep -Seconds $intervalSeconds
          } while ($true)

          if ($successfulChecks -eq 0) {
            throw 'Watcher could not complete a successful Korean Air source check'
          }

          if ($sawStaleDailyMarker) {
            Write-Host 'Korean Air US-edge DOM is still stale. Late backup watchers remain armed through 02:03 KST.'
          } else {
            Write-Host 'No new source marker observed in this watcher window.'
          }
