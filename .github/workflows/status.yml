name: Refresh Mileway public status
on:
  workflow_run:
    workflows:
      - Collect public daily award seats
      - Watch Korean Air daily source
    types: [completed]
  schedule:
    # Time-based freshness can change at the 23:00 KST boundary even without a data commit.
    # Other status refreshes are event-driven by watcher/collector completion and data pushes.
    - cron: '0,5,15,30,45 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/status.yml'
      - 'scripts/build-public-status.mjs'
      - 'src/health-status.mjs'
      - 'src/collection-cycle.mjs'
      - 'public-data/snapshot.json'
      - 'public-data/health.json'
permissions:
  contents: write
concurrency:
  group: mileway-public-status
  cancel-in-progress: true
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build public status contract
        run: node --no-warnings scripts/build-public-status.mjs
      - name: Persist status only when semantic state changed
        shell: bash
        run: |
          SEMANTIC_CHANGED="$(node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const current=JSON.parse(fs.readFileSync('public-data/status.json','utf8'));
          let previous=null;
          try{previous=JSON.parse(execFileSync('git',['show','HEAD:public-data/status.json'],{encoding:'utf8',stdio:['ignore','pipe','ignore']}));}catch{}
          const semantic=value=>{if(!value)return null;const copy={...value};delete copy.generated_at;delete copy.heartbeat_at;return copy;};
          process.stdout.write(JSON.stringify(semantic(current))===JSON.stringify(semantic(previous))?'0':'1');
          NODE
          )"
          if [ "$SEMANTIC_CHANGED" = "0" ]; then
            git checkout -- public-data/status.json
            echo "Semantic status unchanged; skip heartbeat-only commit and downstream redeploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/status.json
          if git diff --cached --quiet; then
            echo "Status unchanged."
            exit 0
          fi
          git commit -m "Update Mileway public status"
          git pull --rebase origin main
          git push
