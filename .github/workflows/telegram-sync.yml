name: Sync Telegram alerts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/alert-api.mjs'
      - 'scripts/register-telegram.mjs'
      - '.github/workflows/telegram-sync.yml'
  schedule:
    # Back up recovery state twice a day without keeping the free Render API awake 24/7.
    # Notification delivery performs its own warm-up immediately before sending.
    - cron: '50 5,17 * * *'
permissions:
  contents: write
concurrency:
  group: telegram-alert-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Provision direct Telegram webhook
        if: github.event_name != 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node --no-warnings scripts/register-telegram.mjs
      - name: Fetch encrypted alert recovery backup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const token=process.env.TELEGRAM_BOT_TOKEN||'';
          if(!token) throw new Error('TELEGRAM_BOT_TOKEN missing');
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),90000);
          let res;
          try{res=await fetch('https://mileway-alert-api.onrender.com/internal/backup',{headers:{Authorization:`Bearer ${token}`},signal:controller.signal});}
          finally{clearTimeout(timer);}
          if(!res.ok) throw new Error(`Encrypted backup failed: HTTP ${res.status}`);
          const record=await res.json();
          if(!record?.ciphertext) throw new Error('Encrypted backup payload missing');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/alerts.enc.json',JSON.stringify(record,null,2)+'\n');
          console.log('Encrypted alert recovery backup ready. No user rules are written to main.');
          NODE
      - name: Persist encrypted backup on isolated ops-state branch
        shell: bash
        run: |
          git fetch origin ops-state
          git worktree add "$RUNNER_TEMP/ops-state" origin/ops-state
          cd "$RUNNER_TEMP/ops-state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ops
          cp "$RUNNER_TEMP/alerts.enc.json" ops/alerts.enc.json
          git add ops/alerts.enc.json
          if ! git diff --cached --quiet; then
            git commit -m "Back up encrypted alert state"
            git pull --rebase origin ops-state
            git push origin HEAD:ops-state
          fi
