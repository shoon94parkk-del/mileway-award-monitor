name: Korean Air transport probe
on:
  push:
    branches: [fast-source-watcher]
    paths:
      - 'scripts/transport-probe.mjs'
      - 'src/public-source-check.mjs'
      - 'scripts/collect-regions.mjs'
      - '.github/workflows/transport-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Verify actual source timestamp check
        run: node --no-warnings src/public-source-check.mjs --snapshot public-data/snapshot.json
      - name: Smoke test one Europe route and month
        run: node --no-warnings src/public-extract.mjs --group 유럽 --route LHR --start 2026-09-10 --end 2026-09-30 --output data/smoke --interval-ms 3000 --max-retries 1
