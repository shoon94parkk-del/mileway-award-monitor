name: One-off worldwide screening validation
on:
  push:
    branches: [worldwide-screening-probe-20260911]
    paths:
      - '.github/workflows/worldwide-screening-probe.yml'
permissions:
  contents: read
jobs:
  screen:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Run unit tests
        run: npm test
      - name: Screen every discovered international destination for the current month
        run: node --no-warnings src/public-extract.mjs --start 2026-09-11 --end 2026-09-30 --output data/world-screen --interval-ms 3000 --max-retries 2
      - name: Print and validate worldwide summary
        if: always()
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const p='data/world-screen/results.json'; if(!fs.existsSync(p)){console.error('WORLD_SCREEN results missing');process.exit(1)} const r=JSON.parse(fs.readFileSync(p,'utf8')); const available=(r.rows||[]).filter(x=>x.available).length; const summary={source_updated_at:r.source_updated_at,discovered_routes:(r.routes||[]).length,target_routes:(r.target_routes||[]).length,coverage:(r.coverage||[]).length,unqueryable:(r.unqueryable||[]).length,failed:(r.failed||[]).length,available_rows:available,attempt_complete:r.attempt_complete,complete:r.complete}; console.log('WORLD_SCREEN_SUMMARY '+JSON.stringify(summary)); if((r.target_routes||[]).length<100 || (r.failed||[]).length>0 || r.attempt_complete!==true) process.exit(1);"
